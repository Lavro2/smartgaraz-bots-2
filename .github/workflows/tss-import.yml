name: TSS import (paralelne)
# Prvý / doháňací import celého TSS katalógu (dáta z HQ, nie z tssgroup.sk) v N paralelných častiach.
# publish = len zverejniť TSS koncepty, ktoré prešli kontrolou kvality (kategória, cena, foto, SK názov).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "import | publish"
        required: false
        default: "import"
jobs:
  import:
    if: github.event.inputs.mode != 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1  # shop rýchlosť má prednosť
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Import
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TSS_SHARD: "${{ matrix.shard }}/6"
          SG_ACCOUNT_COUNT: "1"
          IMPORT_IN_STOCK: "1"
          SG_IMPORT_BUDGET_S: "16000"
        run: python bot/supplier_import.py --supplier tss --mode full --limit 0
  publish:
    if: github.event.inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Publish QA-passing TSS drafts
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          SG_ACCOUNT_COUNT: "1"
        run: python bot/publish_ready_drafts.py --limit 0 --supplier tss --sleep 0.1
