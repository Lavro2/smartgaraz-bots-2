name: Repair ideo products (názov / kategória)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = len výpis"
        required: false
        default: "0"
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Repair
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          IDEO_USER: ${{ secrets.IDEO_USER }}
          IDEO_PASSWORD: ${{ secrets.IDEO_PASSWORD }}
        run: python bot/repair_ideo_products.py ${{ github.event.inputs.dry_run == '1' && '--dry-run' || '' }}
