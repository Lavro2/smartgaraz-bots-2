name: Repair TSS products (názov / kategória)
# Zapnuté až keď repo variable TSS_ENABLED = 1 (po overení prihlásenia do tssgroup.sk).
on:
  schedule:
    - cron: "45 4 * * *"   # 06:45 SK — po nočnom TSS full importe
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = len výpis"
        required: false
        default: "0"
jobs:
  repair:
    if: vars.TSS_ENABLED == '1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Repair
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          TSS_USER: ${{ secrets.TSS_USER }}
          TSS_PASSWORD: ${{ secrets.TSS_PASSWORD }}
        run: python bot/repair_tss_products.py ${{ github.event.inputs.dry_run == '1' && '--dry-run' || '' }}
